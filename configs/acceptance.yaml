{
  "_comment": [
    "Final acceptance configuration. JSON-compatible YAML so that no YAML",
    "parser is required. The only supported model is spectral_dense; the basis",
    "path is supplied by the run directory (scripts/fit_basis.py writes it,",
    "scripts/train.py reads it), so it is deliberately absent here.",
    "",
    "data.root is the canonical acceptance dataset on this server; override it",
    "with --data-root or the DATA_ROOT environment variable to run elsewhere.",
    "",
    "device is cpu: the canonical acceptance path is CPU, and the recorded",
    "result was produced on CPU. --device cuda/auto are available but are not",
    "the acceptance baseline, and the surrogate venv carries a CPU-only torch",
    "wheel, so cuda is not presently selectable here."
  ],

  "seed": 20260810,
  "device": "cpu",
  "acceptance": { "threshold": 1.0e-4 },

  "data": {
    "root": "/nishome/charliewang/data/oled_microstage_inverse_disturbance",
    "input_fields": ["force", "encoder_displacement"],
    "target_fields": ["disturbance"],
    "time_start": 0,
    "time_stop": null,
    "time_stride": 1,
    "preprocessing": { "name": "diff_features", "dt": 0.001, "channels": [4, 5, 6, 7] },
    "dtype": "float64",
    "transform_dtype": "float64",
    "memory_cache": true,
    "batch_size": 5000,
    "eval_batch_size": 128,
    "num_workers": 0,
    "max_train_samples": null,
    "max_val_samples": null,
    "max_test_samples": null
  },

  "model": {
    "name": "spectral_dense",
    "init_scale": 0.001
  },

  "loss": { "name": "mse" },
  "optimizer": { "name": "sgd", "lr": 268400.0, "momentum": 0.0, "weight_decay": 0.0 },
  "scheduler": { "name": "cosine", "eta_min": 0.0 },
  "training": { "epochs": 100, "validate_every": 5, "grad_clip": 0.0 },
  "checkpoint": { "save_best": true, "save_last": true },
  "experiment": { "root": "runs", "run_dir": null, "save": true }
}
